name: Release

# 触发方式：推送形如 v1.0.0 的标签即自动构建并发布到 GitHub Releases
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install goversioninfo
        shell: pwsh
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          "$(go env GOPATH)/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build (Canyou.exe)
        env:
          VER: ${{ github.ref_name }}   # 形如 v1.2.3，注入到标题栏与 EXE 版本
        run: cmd /c build.bat

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Canyou ${{ github.ref_name }}
          files: Canyou-${{ github.ref_name }}.exe
          generate_release_notes: true
